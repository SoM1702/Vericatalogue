services:
  backend:
    build:
      context: ./backend
    environment:
      VERICATALOG_DB_PATH: /data/vericatalog.sqlite3
      VERICATALOG_UPLOAD_DIR: /data/uploads
      VERICATALOG_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # Optional server-side mapper. Values are empty/off by default; use
      # `docker compose --env-file backend/.env up --build` only after adding
      # the owner's provider settings to the ignored backend/.env file.
      VERICATALOG_AI_ENABLED: ${VERICATALOG_AI_ENABLED:-false}
      VERICATALOG_AI_API_KEY: ${VERICATALOG_AI_API_KEY:-}
      VERICATALOG_AI_BASE_URL: ${VERICATALOG_AI_BASE_URL:-}
      VERICATALOG_AI_MODEL: ${VERICATALOG_AI_MODEL:-}
      VERICATALOG_AI_TIMEOUT_SECONDS: ${VERICATALOG_AI_TIMEOUT_SECONDS:-15}
      VERICATALOG_AI_BATCH_LIMIT: ${VERICATALOG_AI_BATCH_LIMIT:-10}
    volumes:
      - vericatalog-data:/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${VERICATALOG_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  vericatalog-data:
