<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFFFFF;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="90"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-trust-gap"
        class="scene"
        data-composition-id="01-trust-gap"
        data-composition-src="compositions/frames/01-trust-gap.html"
        data-start="0"
        data-duration="8.4"
        data-track-index="0"
      ></div>

      <div
        id="el-02-field-evidence"
        class="scene"
        data-composition-id="02-field-evidence"
        data-composition-src="compositions/frames/02-field-evidence.html"
        data-start="8"
        data-duration="14.5"
        data-track-index="1"
      ></div>

      <div
        id="el-03-review-before-export"
        class="scene"
        data-composition-id="03-review-before-export"
        data-composition-src="compositions/frames/03-review-before-export.html"
        data-start="22"
        data-duration="16.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-bounded-ai"
        class="scene"
        data-composition-id="04-bounded-ai"
        data-composition-src="compositions/frames/04-bounded-ai.html"
        data-start="38"
        data-duration="15.4"
        data-track-index="1"
      ></div>

      <div
        id="el-05-sku-separation"
        class="scene"
        data-composition-id="05-sku-separation"
        data-composition-src="compositions/frames/05-sku-separation.html"
        data-start="53"
        data-duration="18.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-catalog-health"
        class="scene"
        data-composition-id="06-catalog-health"
        data-composition-src="compositions/frames/06-catalog-health.html"
        data-start="71"
        data-duration="19"
        data-track-index="1"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-trust-gap", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 8);
        tl.fromTo("#el-02-field-evidence", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 8);
        tl.to("#el-02-field-evidence", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 22);
        tl.fromTo("#el-03-review-before-export", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 22);
        tl.to("#el-03-review-before-export", { x: -1920, duration: 0.5, ease: "power3.inOut" }, 38);
        tl.fromTo("#el-04-bounded-ai", { x: 1920, opacity: 1 }, { x: 0, duration: 0.5, ease: "power3.inOut" }, 38);
        tl.to("#el-04-bounded-ai", { scaleX: 0, transformOrigin: "left center", duration: 0.4, ease: "power3.inOut" }, 53);
        tl.fromTo("#el-05-sku-separation", { scaleX: 0, transformOrigin: "right center", opacity: 1 }, { scaleX: 1, transformOrigin: "right center", duration: 0.4, ease: "power3.inOut" }, 53);
        tl.to("#el-05-sku-separation", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 71);
        tl.fromTo("#el-06-catalog-health", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 71);
        tl.to({}, { duration: 90 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
