  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });
      const product = document.getElementById("evidence02-product-shell");
      const opening = document.getElementById("evidence02-opening-copy");
      const eyebrow = document.getElementById("evidence02-eyebrow");
      const rule = document.getElementById("evidence02-rule");
      const backplate = document.getElementById("evidence02-product-backplate");
      const zoomOuter = document.getElementById("evidence02-zoom-outer");
      const zoomInner = document.getElementById("evidence02-zoom-inner");
      const target = document.getElementById("evidence02-retained-target");
      const finalCopy = document.getElementById("evidence02-final-copy");
      const progressFill = document.getElementById("evidence02-progress-fill");
      const blurNode = document.getElementById("evidence02-streak-blur");
      const blurProxy = { value: 18 };

      const writeBlur = () => blurNode.setAttribute("stdDeviation", `${blurProxy.value} 0`);
      writeBlur();

      tl.fromTo(rule, { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.38, ease: "power3.out" }, 0.06);
      tl.fromTo(eyebrow, { opacity: 0, y: -14 }, { opacity: 1, y: 0, duration: 0.46, ease: "power3.out" }, 0.13);
      tl.fromTo(opening, { opacity: 0, x: -78 }, { opacity: 1, x: 0, duration: 0.72, ease: "power4.out" }, 0.22);
      tl.fromTo(backplate, { opacity: 0, x: 280, scale: 0.97 }, { opacity: 1, x: 0, scale: 1, duration: 0.62, ease: "power4.out" }, 0.06);
      tl.fromTo(product, { opacity: 0, x: 570, scale: 0.94 }, { opacity: 1, x: 0, scale: 1, duration: 0.62, ease: "power4.out" }, 0.06);
      tl.to(blurProxy, { value: 0, duration: 0.62, ease: "power4.out", onUpdate: writeBlur }, 0.06);

      const CONTENT = [
        { id: "source", title: "Source file", hold: 0.45 },
        { id: "page", title: "Page + snippet", hold: 0.45 },
        { id: "raw", title: "Raw value", hold: 0.45 },
        { id: "normalized", title: "Normalized value", hold: 0.55 },
      ];
      const BASE_DURATION = 0.45;
      const SEC_PER_CHAR = 0.025;
      let cursor = 3.25;
      const TIMELINE = CONTENT.map((entry) => {
        const duration = BASE_DURATION + entry.title.length * SEC_PER_CHAR + entry.hold;
        const start = cursor;
        cursor += duration;
        return { ...entry, start, end: cursor };
      });

      TIMELINE.forEach((entry, index) => {
        const card = document.getElementById(`evidence02-callout-${entry.id}`);
        const line = document.getElementById(`evidence02-line-${entry.id}`);
        const words = card.querySelectorAll(".frame-evidence02-callout-label span");
        const direction = index % 2 === 0 ? -34 : 34;

        tl.fromTo(card, { opacity: 0, x: direction, y: 14, scale: 0.97 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.48, ease: "power3.out" }, entry.start);
        tl.fromTo(line, { opacity: 0, strokeDashoffset: 150 }, { opacity: 0.72, strokeDashoffset: 0, duration: 0.42, ease: "power2.out" }, entry.start + 0.08);
        tl.fromTo(words, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.24, stagger: 0.07, ease: "power2.out" }, entry.start + 0.14);
      });

      const targetRect = target.getBoundingClientRect();
      const targetOffsetX = targetRect.left + targetRect.width / 2 - 960;
      const targetOffsetY = targetRect.top + targetRect.height / 2 - 540;
      const zoomScale = Math.min(1.12, (0.88 * 1920) / targetRect.width, (0.88 * 1080) / targetRect.height);

      tl.fromTo(target, { opacity: 0, scale: 0.84 }, { opacity: 1, scale: 1, duration: 0.42, ease: "power3.out" }, 8.62);
      tl.to(zoomOuter, { scale: zoomScale, duration: 1.45, ease: "power3.inOut" }, 8.8);
      tl.to(zoomInner, { x: -targetOffsetX, y: -targetOffsetY, duration: 1.45, ease: "power3.inOut" }, 8.8);
      tl.fromTo(finalCopy, { opacity: 0, x: -42, y: 18 }, { opacity: 1, x: 0, y: 0, duration: 0.58, ease: "power3.out" }, 10.18);
      tl.fromTo(progressFill, { scaleX: 0 }, { scaleX: 1, duration: 10.9, ease: "none" }, 0);

      window.__timelines["02-field-evidence"] = tl;
    })();
  </script>
