  <script>
    (() => {
    const tl = gsap.timeline({ paused: true });
    window.__timelines = window.__timelines || {};
    window.__timelines["06-catalog-health"] = tl;

    const openingCard = document.getElementById("health06-opening-card");
    const titleCard = document.getElementById("health06-title-card");
    const evidenceCard = document.getElementById("health06-evidence-card");
    const finalCard = document.getElementById("health06-final-card");
    const chips = [
      document.getElementById("health06-chip-verified"),
      document.getElementById("health06-chip-inferred"),
      document.getElementById("health06-chip-conflict"),
    ];
    gsap.set([openingCard, titleCard, evidenceCard, finalCard], { opacity: 0 });


    tl.fromTo(
      openingCard,
      { opacity: 0, y: 18 },
      { opacity: 1, y: 0, duration: 0.42, ease: "power3.out" },
      0.14,
    );
    tl.to(
      openingCard,
      { opacity: 0, scale: 0.76, duration: 0.4, ease: "power2.in" },
      0.82,
    );
    tl.fromTo(
      titleCard,
      { opacity: 0, y: 24, scale: 0.76 },
      { opacity: 1, y: 0, scale: 1, duration: 0.62, ease: "back.out(1.4)" },
      1.06,
    );

    const STATUS_SEQUENCE = [
      { t: 0, count: 0 },
      { t: 5.2, count: 1 },
      { t: 7.25, count: 2 },
      { t: 9.55, count: 3 },
    ];
    const statusDriver = { t: 0 };
    function statusCountAt(time) {
      for (let index = STATUS_SEQUENCE.length - 1; index >= 0; index -= 1) {
        if (time >= STATUS_SEQUENCE[index].t) return STATUS_SEQUENCE[index].count;
      }
      return 0;
    }
    function renderStatus(time) {
      const count = statusCountAt(time);
      chips.forEach((chip, index) => {
        chip.style.opacity = index < count ? "1" : "0";
      });
    }
    renderStatus(0);
    tl.to(
      statusDriver,
      {
        t: 11.49,
        duration: 11.49,
        ease: "none",
        onUpdate: () => renderStatus(statusDriver.t),
      },
      0,
    );

    tl.set([titleCard, ...chips], { opacity: 0 }, 11.5);
    tl.fromTo(
      evidenceCard,
      { opacity: 0, y: 24, scale: 0.96 },
      { opacity: 1, y: 0, scale: 1, duration: 0.62, ease: "power3.out" },
