  <script>
    (() => {
    window.__timelines = window.__timelines || {};

    const stage = document.getElementById("review03-stage");
    const root = stage.closest('[data-composition-id="03-review-before-export"]');
    const world = root.querySelector(".review03-world");
    const normalize = root.querySelector(".review03-normalize-enter");
    const evidence = document.getElementById("review03-evidence");
    const validateTitle = document.getElementById("review03-validate-title");
    const validateCard = document.getElementById("review03-validate-card");
    const reviewTitle = document.getElementById("review03-review-title");
    const burstItems = root.querySelectorAll(".review03-burst-item");
    const exportLock = document.getElementById("review03-lock");
    const camera = { x: 0, y: 0, scale: 1 };

    function applyCamera() {
      world.style.transform = `translate(${camera.x}px, ${camera.y}px) scale(${camera.scale})`;
    }

    applyCamera();

    const tl = gsap.timeline({ paused: true });
    gsap.set([normalize, validateTitle, validateCard, reviewTitle, exportLock], { autoAlpha: 0 });
    gsap.set(burstItems, { autoAlpha: 0 });


    tl.fromTo(
      evidence,
      { opacity: 0.58, scale: 0.985 },
      { opacity: 1, scale: 1, duration: 0.7, ease: "power2.out" },
      0,
    );
    tl.fromTo(
      normalize,
      { autoAlpha: 0, y: 30 },
      { autoAlpha: 1, y: 0, duration: 0.72, ease: "power3.out" },
      0.35,
    );

    tl.to(
      camera,
      {
        x: -880,
        y: -12,
        duration: 2.15,
        ease: "power2.inOut",
        onUpdate: applyCamera,
      },
      4,
    );
    tl.fromTo(
      validateTitle,
      { autoAlpha: 0, y: 28 },
      { autoAlpha: 1, y: 0, duration: 0.62, ease: "power3.out" },
      5.55,
    );
    tl.fromTo(
      validateCard,
      { autoAlpha: 0, y: 34, scale: 0.98 },
      { autoAlpha: 1, y: 0, scale: 1, duration: 0.78, ease: "power3.out" },
      6.35,
    );

    tl.to(
      camera,
      {
        x: -2780,
        y: -6,
        duration: 2.1,
        ease: "power2.inOut",
        onUpdate: applyCamera,
      },
      9.5,
    );
    tl.fromTo(
      reviewTitle,
      { autoAlpha: 0, y: 30 },
      { autoAlpha: 1, y: 0, duration: 0.62, ease: "power3.out" },
      10.95,
    );
    burstItems.forEach((item, index) => {
      tl.fromTo(
        item,
        { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.6, autoAlpha: 0 },
        {
          x: Number(item.dataset.targetX),
          y: Number(item.dataset.targetY),
          scale: 1,
          autoAlpha: 1,
          duration: 1.25,
          ease: "power3.out",
        },
        11.45 + index * 0.07,
      );
    });
    tl.fromTo(
      exportLock,
      { autoAlpha: 0, y: 18, scale: 0.98 },
      { autoAlpha: 1, y: 0, scale: 1, duration: 0.65, ease: "power3.out" },
      14,
    );

    window.__timelines["03-review-before-export"] = tl;
    })();
