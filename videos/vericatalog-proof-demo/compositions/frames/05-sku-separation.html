  <script>
    (() => {
      const title = document.getElementById("sku05-title-inner");
      const supplierSheet = document.getElementById("sku05-supplier-sheet");
      const leftEntry = document.getElementById("sku05-left-entry");
      const rightEntry = document.getElementById("sku05-right-entry");
      const leftCard = document.getElementById("sku05-left-card");
      const rightCard = document.getElementById("sku05-right-card");
      const leftFloat = document.getElementById("sku05-left-float");
      const rightFloat = document.getElementById("sku05-right-float");
      const leftBadge = document.getElementById("sku05-badge-left");
      const rightBadge = document.getElementById("sku05-badge-right");
      const statement = document.getElementById("sku05-statement-inner");
      const leftCopy = [
        document.getElementById("sku05-left-number"),
        document.getElementById("sku05-left-material"),
        document.getElementById("sku05-left-size"),
        document.getElementById("sku05-left-pressure"),
        document.getElementById("sku05-left-record"),
      ];
      const rightCopy = [
        document.getElementById("sku05-right-number"),
        document.getElementById("sku05-right-material"),
        document.getElementById("sku05-right-size"),
        document.getElementById("sku05-right-pressure"),
        document.getElementById("sku05-right-record"),
      ];

      const tl = gsap.timeline({ paused: true });

      tl.fromTo(title, { y: -64, opacity: 0 }, { y: 0, opacity: 1, duration: 1.25, ease: "power3.out" }, 0);
      tl.fromTo(supplierSheet, { y: 16, scale: 0.985, opacity: 0 }, { y: 0, scale: 1, opacity: 0.72, duration: 0.9, ease: "power3.out" }, 1.35);

      tl.fromTo(leftEntry, { x: -360, scale: 0.85, opacity: 0 }, { x: 0, scale: 1, opacity: 1, duration: 1.12, ease: "power3.out" }, 3.0);
      tl.fromTo(leftCard, { rotateY: 23 }, { rotateY: 13, duration: 1.12, ease: "power3.out" }, 3.0);
      tl.fromTo(rightEntry, { x: 360, scale: 0.85, opacity: 0 }, { x: 0, scale: 1, opacity: 1, duration: 1.12, ease: "power3.out" }, 3.22);
      tl.fromTo(rightCard, { rotateY: -23 }, { rotateY: -13, duration: 1.12, ease: "power3.out" }, 3.22);

      leftCopy.forEach((element, index) => {
        tl.fromTo(element, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.52, ease: "power2.out" }, 3.7 + index * 0.66);
      });
      rightCopy.forEach((element, index) => {
        tl.fromTo(element, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.52, ease: "power2.out" }, 3.94 + index * 0.66);
      });
      tl.fromTo(supplierSheet, { scale: 1, opacity: 0.72 }, { scale: 0.96, opacity: 0.2, duration: 2.35, ease: "power2.out" }, 5.4);

      tl.fromTo(leftBadge, { scale: 0, y: 14, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.58, ease: "power3.out" }, 9.55);
      tl.fromTo(rightBadge, { scale: 0, y: 14, opacity: 0 }, { scale: 1, y: 0, opacity: 1, duration: 0.58, ease: "power3.out" }, 11.02);

      tl.fromTo(statement, { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.82, ease: "power3.out" }, 14.55);

      const phase = { p: 0 };
      tl.to(phase, {
        p: Math.PI * 2 * 1.1,
        duration: 3.25,
        ease: "none",
        onUpdate: () => {
          const progress = phase.p / (Math.PI * 2 * 1.1);
          const envelope = progress < 0.8 ? 1 : (1 - progress) / 0.2;
          const offset = Math.sin(phase.p) * 2 * envelope;
          leftFloat.style.transform = `translateY(${offset}px)`;
          rightFloat.style.transform = `translateY(${-offset}px)`;
        },
      }, 14.75);

      window.__timelines = window.__timelines || {};
      window.__timelines["05-sku-separation"] = tl;
    })();
